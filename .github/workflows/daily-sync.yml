name: Manual Content Sync (backup)

# 日常增量已由 Vercel Cron 负责（vercel.json → /api/cron/sync-content，每天 03:00 东八区）。
# 这个 workflow 只作为手动备份通道：Vercel 侧出问题时，在 Actions 页面点 Run workflow。
# 定时触发仍然关闭（源 API 历史上 403 过 GitHub Actions 的 IP；现在是否恢复未验证）。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "同步模式"
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full
          - dry-run

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync metadata from main site
        run: |
          case "${{ inputs.mode }}" in
            full) node scripts/sync-content.mjs --full ;;
            dry-run) node scripts/sync-content.mjs --dry-run ;;
            *) node scripts/sync-content.mjs ;;
          esac
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CONTENT_SOURCE_API_URL: ${{ secrets.CONTENT_SOURCE_API_URL }}
          CONTENT_SYNC_PAGE_SIZE: "50"
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
